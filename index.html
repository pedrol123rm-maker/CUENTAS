<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5ba8d4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<title>💰 Cuentas Pendientes</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#5ba8d4;
  --azul2:#7ec8e3;
  --azul3:#3a9abc;
  --fondo:#f5fbff;
  --fondo2:#eaf5fb;
  --card:#ffffff;
  --borde:#b0d8f0;
  --borde2:#deeef8;
  --txt:#1a3a50;
  --txt2:#90c0d8;
  --negro:#1a1a1a;
  --rojo:#cc2020;
  --verde:#1e8a45;
  --shadow:0 2px 12px rgba(91,168,212,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--fondo);
  color:var(--txt);
  min-height:100vh;
  padding-bottom:50px;
  -webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
.hdr{
  background:linear-gradient(135deg,#5ba8d4,#7ec8e3);
  padding:env(safe-area-inset-top, 16px) 16px 14px;
  padding-top:max(env(safe-area-inset-top),16px);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
  box-shadow:0 2px 12px rgba(91,168,212,0.25);
}
.hdr-titulo{font-size:20px;font-weight:900;color:#fff;letter-spacing:-0.5px;}
.hdr-sub{font-size:24px;font-weight:900;color:rgba(255,255,255,0.9);margin-top:0;}
.hdr-badge{
  font-size:10px;font-weight:700;
  background:rgba(255,255,255,0.22);
  color:#fff;padding:5px 11px;
  border-radius:20px;border:1px solid rgba(255,255,255,0.35);
  white-space:nowrap;
}

/* ── MAIN ── */
.main{padding:14px;display:flex;flex-direction:column;gap:12px;max-width:600px;margin:0 auto;}

/* ── CARD ── */
.card{
  background:var(--card);
  border-radius:18px;
  border:0.5px solid var(--borde);
  padding:16px;
  box-shadow:var(--shadow);
}

/* ── COLAPSABLE ── */
.colapsa-header{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  min-height:44px;
}
.colapsa-header:active{opacity:0.7;}
.colapsa-titulo{
  font-size:14px;font-weight:800;color:var(--txt);
  display:flex;align-items:center;gap:8px;
}
.ctag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;}
.ctag-azul{background:rgba(91,168,212,0.15);color:var(--azul3);}
.ctag-verde{background:#e8f8ee;color:#1a7a3a;}
.colapsa-flecha{
  width:32px;height:32px;
  background:var(--fondo2);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--azul3);
  border:1px solid var(--borde);
  transition:transform 0.3s ease,background 0.2s;
  flex-shrink:0;
}
.colapsa-flecha.abierto{transform:rotate(180deg);background:var(--azul3);color:#fff;}
.colapsa-cuerpo{
  overflow:hidden;max-height:0;
  transition:max-height 0.4s ease,opacity 0.3s ease,margin-top 0.3s ease;
  opacity:0;margin-top:0;
}
.colapsa-cuerpo.abierto{max-height:800px;opacity:1;margin-top:14px;}

/* ── BUSCADOR ── */
.busqueda{
  width:100%;
  background:var(--fondo2);
  border:1.5px solid var(--borde);
  border-radius:14px;
  padding:14px 16px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:16px;color:var(--txt);
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.busqueda:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(91,168,212,0.15);}
.busqueda::placeholder{color:var(--txt2);}

/* ── RESUMEN ── */
.resumen-total{
  background:linear-gradient(135deg,#5ba8d4,#7ec8e3);
  border-radius:14px;padding:14px;color:#fff;
  position:relative;overflow:hidden;
}
.resumen-total::after{
  content:'';position:absolute;top:-30px;right:-30px;
  width:100px;height:100px;
  background:radial-gradient(circle,rgba(255,255,255,0.12) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.res-label{font-size:9px;font-weight:700;opacity:0.65;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.res-grande{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1;}
.res-sub{font-size:10px;opacity:0.6;margin-top:2px;margin-bottom:12px;}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.res-item{background:rgba(255,255,255,0.15);border-radius:11px;padding:9px 8px;text-align:center;border:1px solid rgba(255,255,255,0.18);}
.res-item-val{font-size:13px;font-weight:800;display:block;color:#fff;}
.res-item-lbl{font-size:9px;opacity:0.6;display:block;margin-top:1px;}
.barra-wrap{background:rgba(255,255,255,0.18);border-radius:99px;height:6px;overflow:hidden;margin-top:12px;}
.barra-fill{height:100%;border-radius:99px;background:rgba(255,255,255,0.7);transition:width 0.7s cubic-bezier(0.34,1.56,0.64,1);}
.barra-labels{display:flex;justify-content:space-between;font-size:9px;margin-top:4px;opacity:0.65;}
.barra-labels span:last-child{font-weight:800;opacity:1;}

/* ── CAMPOS ── */
.campo{margin-bottom:10px;}
.campo label{font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;}
.campo input{
  width:100%;background:var(--fondo2);
  border:1.5px solid var(--borde);border-radius:12px;
  padding:14px;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:16px;color:var(--txt);outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.campo input:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(91,168,212,0.15);}
.campo input::placeholder{color:var(--borde);}

/* ── BOTONES ── */
.btn{
  width:100%;padding:15px;border-radius:14px;border:none;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:16px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform 0.12s,box-shadow 0.12s;
  min-height:52px;
}
.btn:active{transform:scale(0.97);}
.btn-azul{background:linear-gradient(135deg,#5ba8d4,#7ec8e3);color:#fff;box-shadow:0 4px 14px rgba(91,168,212,0.4);}
.btn-verde{background:linear-gradient(135deg,#1e8a45,#2ecc71);color:#fff;box-shadow:0 4px 14px rgba(30,138,69,0.3);}

/* ── DIVIDER ── */
.divider{display:flex;align-items:center;gap:8px;color:var(--txt2);font-size:11px;font-weight:600;margin:2px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--borde2);}

/* ── TARJETA DEUDOR ── */
.deudor-card{
  background:var(--card);border-radius:16px;
  border:0.5px solid var(--borde);overflow:hidden;
  animation:fadeUp 0.25s ease both;
  box-shadow:var(--shadow);border-left:4px solid var(--borde);
  margin-bottom:10px;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.urg-ok  {border-left-color:#7ec8e3;}
.urg-med {border-left-color:#f0c040;}
.urg-alta{border-left-color:#e08030;}
.urg-crit{border-left-color:#cc2020;}

.d-top{padding:12px 14px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.d-nombre{font-size:15px;font-weight:800;color:var(--txt);}
.d-meta{font-size:10px;color:var(--txt2);margin-top:2px;}
.badge-dias{font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.b-ok  {background:#eaf5fb;color:var(--azul3);}
.b-med {background:#fef8e0;color:#c08000;}
.b-alta{background:#fff3e0;color:#c05000;}
.b-crit{background:#fce8e8;color:#b02020;}

.d-montos{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:0.5px solid var(--borde2);border-bottom:0.5px solid var(--borde2);}
.d-monto{text-align:center;padding:9px 4px;}
.d-monto:not(:last-child){border-right:0.5px solid var(--borde2);}
.d-monto-val{font-size:13px;font-weight:800;display:block;}
.d-monto-lbl{font-size:9px;color:var(--txt2);display:block;margin-top:1px;}
.col-negro{color:var(--negro);}
.col-rojo {color:var(--rojo);}
.col-verde{color:var(--verde);}

.d-barra{padding:7px 14px 4px;}
.d-barra-track{background:var(--fondo2);border-radius:99px;height:4px;overflow:hidden;}
.d-barra-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#5ba8d4,#7ec8e3);transition:width 0.5s ease;}
.d-barra-pct{font-size:9px;color:var(--txt2);text-align:right;margin-top:2px;}

.d-acciones{display:flex;gap:8px;padding:9px 12px;}
.btn-sm{
  flex:1;padding:10px 6px;border-radius:10px;border:none;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
  transition:transform 0.12s;min-height:40px;
}
.btn-sm:active{transform:scale(0.95);}
.btn-sm-azul{background:var(--fondo2);color:var(--azul3);border:1px solid var(--borde);}
.btn-sm-rojo{background:#fce8e8;color:#b03030;border:1px solid #f0c8c8;}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.5);
  display:none;align-items:flex-end;justify-content:center;
  z-index:1000;backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex;}
.modal{
  background:#fff;border-radius:22px 22px 0 0;
  padding:20px 16px max(env(safe-area-inset-bottom,20px),30px);
  width:100%;max-width:600px;
  border-top:3px solid var(--azul);
  animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  max-height:85vh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-titulo{font-size:17px;font-weight:800;color:var(--azul3);}
.modal-sub{font-size:11px;color:var(--txt2);margin-top:3px;margin-bottom:14px;}
.modal-resumen{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;}
.mres-item{background:var(--fondo2);border-radius:11px;padding:10px 6px;text-align:center;border:0.5px solid var(--borde);}
.mres-val{font-size:12px;font-weight:800;display:block;}
.mres-lbl{font-size:9px;color:var(--txt2);display:block;margin-top:1px;}
.modal-dias{
  background:var(--fondo2);border-radius:12px;padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;border:0.5px solid var(--borde);
}
.modal-dias-lbl{font-size:11px;color:var(--txt2);}
.modal-dias-val{font-size:14px;font-weight:800;color:var(--txt);}
.abono-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;background:var(--fondo2);
  border-radius:11px;margin-bottom:7px;border:0.5px solid var(--borde);
}
.abono-num{font-size:12px;font-weight:700;color:var(--txt);}
.abono-fecha{font-size:10px;color:var(--txt2);}
.abono-val{font-size:13px;font-weight:800;color:var(--verde);}
.btn-cerrar{
  width:100%;margin-top:10px;padding:14px;
  background:var(--fondo2);border:0.5px solid var(--borde);
  border-radius:12px;color:var(--txt);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;min-height:50px;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:max(env(safe-area-inset-bottom,16px),24px);
  left:50%;transform:translateX(-50%) translateY(20px);
  padding:11px 22px;border-radius:30px;
  font-weight:800;font-size:14px;
  opacity:0;transition:all 0.3s;
  z-index:9999;pointer-events:none;
  white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.15);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.t-ok  {background:linear-gradient(135deg,#1e8a45,#2ecc71);color:#fff;}
.t-err {background:linear-gradient(135deg,#cc2020,#ff5050);color:#fff;}
.t-warn{background:linear-gradient(135deg,#c08000,#f0c040);color:#fff;}

/* ── ESTADO VACÍO ── */
.estado-vacio{text-align:center;padding:24px 16px;color:var(--txt2);}
.estado-vacio p{font-size:13px;}
.estado-vacio small{font-size:11px;color:var(--borde);display:block;margin-top:3px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div>
    <div class="hdr-titulo">💰 Cuentas Pendientes</div>
  </div>
  <div style="text-align:right;">
    <div class="hdr-sub" id="hdr-sub">0</div>
    <div class="hdr-badge" id="hdr-sync">⏳</div>
  </div>
</div>

<div class="main">

  <!-- BUSCAR -->
  <div class="card" style="padding:12px;">
    <input class="busqueda" id="busqueda" placeholder="🔍  Buscar..." oninput="buscar(this.value)" autocomplete="off">
    <div id="resultado-busqueda"></div>
  </div>

  <!-- RESUMEN -->
  <div class="card">
    <div class="colapsa-header" onclick="toggleColapsa('body-resumen','flecha-resumen')">
      <div class="colapsa-titulo">📊 Resumen general <span class="ctag ctag-azul">Solo pendientes</span></div>
      <div class="colapsa-flecha" id="flecha-resumen">▾</div>
    </div>
    <div class="colapsa-cuerpo" id="body-resumen">
      <div class="resumen-total">
        <div class="res-label">Total pendiente por cobrar</div>
        <div class="res-grande" id="res-pendiente">$0</div>
        <div class="res-sub" id="res-sub-txt">0 deudores activos</div>
        <div class="res-grid">
          <div class="res-item">
            <span class="res-item-val" id="res-prestado">$0</span>
            <span class="res-item-lbl">💳 Total prestado</span>
          </div>
          <div class="res-item">
            <span class="res-item-val" id="res-abonado">$0</span>
            <span class="res-item-lbl">✅ Total abonado</span>
          </div>
        </div>
        <div class="barra-wrap"><div class="barra-fill" id="barra-fill" style="width:0%"></div></div>
        <div class="barra-labels"><span>Recuperación</span><span id="barra-pct">0%</span></div>
      </div>
    </div>
  </div>

  <div class="divider">Registros</div>

  <!-- REGISTRAR PRÉSTAMO -->
  <div class="card">
    <div class="colapsa-header" onclick="toggleColapsa('body-prestamo','flecha-prestamo')">
      <div class="colapsa-titulo">👤 Registrar préstamo <span class="ctag ctag-azul">Nuevo</span></div>
      <div class="colapsa-flecha" id="flecha-prestamo">▾</div>
    </div>
    <div class="colapsa-cuerpo" id="body-prestamo">
      <div class="campo"><label>Fecha del préstamo</label><input type="date" id="reg-fecha"></div>
      <div class="campo"><label>Nombre completo</label><input type="text" id="reg-nombre" placeholder="Ej: Juan Pérez"></div>
      <div class="campo"><label>Código</label><input type="text" id="reg-codigo" placeholder="Ej: 001 / JP-01"></div>
      <div class="campo"><label>Valor prestado</label><input type="number" id="reg-deuda" placeholder="0" inputmode="numeric"></div>
      <button class="btn btn-azul" onclick="registrar()">✅ Registrar préstamo</button>
    </div>
  </div>

  <!-- REGISTRAR ABONO -->
  <div class="card">
    <div class="colapsa-header" onclick="toggleColapsa('body-abono','flecha-abono')">
      <div class="colapsa-titulo">💵 Registrar abono <span class="ctag ctag-verde">Pago</span></div>
      <div class="colapsa-flecha" id="flecha-abono">▾</div>
    </div>
    <div class="colapsa-cuerpo" id="body-abono">
      <div class="campo"><label>Fecha del abono</label><input type="date" id="abo-fecha"></div>
      <div class="campo"><label>Código del deudor</label><input type="text" id="abo-codigo" placeholder="Ingresa el código"></div>
      <div class="campo"><label>Valor del abono</label><input type="number" id="abo-valor" placeholder="0" inputmode="numeric"></div>
      <button class="btn btn-verde" onclick="abonar()">💰 Registrar abono</button>
    </div>
  </div>

</div>

<!-- MODAL HISTORIAL -->
<div class="modal-overlay" id="modal" onclick="cerrarModal(event)">
  <div class="modal">
    <div class="modal-titulo" id="m-titulo">Historial</div>
    <div class="modal-sub" id="m-sub"></div>
    <div class="modal-resumen">
      <div class="mres-item"><span class="mres-val col-negro" id="m-prestado">$0</span><span class="mres-lbl">Prestado</span></div>
      <div class="mres-item"><span class="mres-val col-rojo"  id="m-abonado">$0</span><span class="mres-lbl">Abonado</span></div>
      <div class="mres-item"><span class="mres-val col-verde" id="m-saldo">$0</span><span class="mres-lbl">Saldo</span></div>
    </div>
    <div class="modal-dias">
      <span class="modal-dias-lbl">📅 Días desde el préstamo</span>
      <span class="modal-dias-val" id="m-dias">0 días</span>
    </div>
    <div id="m-abonos"></div>
    <button class="btn-cerrar" onclick="cerrarModal()">✕ Cerrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════
   STORAGE — guarda en localStorage
   Y también en window.storage si está disponible
════════════════════════════════ */
const KEY = 'cuentas_pendientes_v5';
let personas = [];

async function cargar() {
  // 1. Intenta cargar desde localStorage primero (siempre disponible)
  const local = localStorage.getItem(KEY);
  // 2. Intenta también desde window.storage (nube)
  try {
    const nube = await window.storage.get(KEY);
    if (nube && nube.value) {
      const dataNube = JSON.parse(nube.value);
      // Usa la que tenga más registros
      if (!local || dataNube.length >= JSON.parse(local).length) {
        localStorage.setItem(KEY, nube.value); // sincroniza local
        return dataNube;
      }
    }
  } catch(e) {}
  // 3. Fallback: localStorage
  return local ? JSON.parse(local) : [];
}

async function guardar() {
  const d = JSON.stringify(personas);
  // Siempre guarda en localStorage (nunca se pierde)
  localStorage.setItem(KEY, d);
  // También intenta guardar en nube
  try {
    await window.storage.set(KEY, d);
    setSync('☁️');
  } catch(e) {
    setSync('💾');
  }
}

function setSync(icono) {
  const el = document.getElementById('hdr-sync');
  el.textContent = icono + ' Guardado';
  setTimeout(() => el.textContent = '✅ Listo', 2000);
}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
async function init() {
  personas = await cargar();
  document.getElementById('reg-fecha').value = hoy();
  document.getElementById('abo-fecha').value = hoy();
  actualizarResumen();
}

/* ════════════════════════════════
   UTILIDADES
════════════════════════════════ */
function hoy() { return new Date().toISOString().split('T')[0]; }

function fmt(n) { return '$' + Number(n).toLocaleString('es-CO'); }

function dias(f) { return Math.max(0, Math.floor((new Date() - new Date(f)) / 86400000)); }

function totalAbo(lista) { return (lista || []).reduce((s, a) => s + Number(a.valor), 0); }

function saldo(p) { return Math.max(0, p.deuda - totalAbo(p.abonos)); }

function urgencia(d) {
  if (d <= 7)  return { cls:'urg-ok',   bdg:'b-ok',   txt:`🕐 ${d}d` };
  if (d <= 20) return { cls:'urg-med',  bdg:'b-med',  txt:`⚠️ ${d}d` };
  if (d <= 40) return { cls:'urg-alta', bdg:'b-alta', txt:`🔥 ${d}d` };
  return             { cls:'urg-crit', bdg:'b-crit', txt:`💀 ${d}d` };
}

function toast(msg, tipo='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast t-${tipo} show`;
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* ════════════════════════════════
   COLAPSA
════════════════════════════════ */
function toggleColapsa(idCuerpo, idFlecha) {
  const cuerpo = document.getElementById(idCuerpo);
  const flecha = document.getElementById(idFlecha);
  const abierto = cuerpo.classList.toggle('abierto');
  flecha.classList.toggle('abierto', abierto);
}

/* ════════════════════════════════
   RESUMEN
════════════════════════════════ */
function actualizarResumen() {
  const activos   = personas.filter(p => saldo(p) > 0);
  const tDeuda    = activos.reduce((s, p) => s + p.deuda, 0);
  const tAbonado  = activos.reduce((s, p) => s + totalAbo(p.abonos), 0);
  const tPendiente = activos.reduce((s, p) => s + saldo(p), 0);
  const pct = tDeuda > 0 ? Math.round((tAbonado / tDeuda) * 100) : 0;

  document.getElementById('res-pendiente').textContent = fmt(tPendiente);
  document.getElementById('res-prestado').textContent  = fmt(tDeuda);
  document.getElementById('res-abonado').textContent   = fmt(tAbonado);
  document.getElementById('res-sub-txt').textContent   = `${activos.length} deudores activos`;
  document.getElementById('barra-fill').style.width    = pct + '%';
  document.getElementById('barra-pct').textContent     = pct + '%';
  document.getElementById('hdr-sub').textContent       = activos.length;
}

/* ════════════════════════════════
   REGISTRAR PRÉSTAMO
════════════════════════════════ */
async function registrar() {
  const fecha  = document.getElementById('reg-fecha').value;
  const nombre = document.getElementById('reg-nombre').value.trim();
  const codigo = document.getElementById('reg-codigo').value.trim().toUpperCase();
  const deuda  = Number(document.getElementById('reg-deuda').value);

  if (!fecha || !nombre || !codigo || !deuda) {
    toast('⚠️ Completa todos los campos', 'warn'); return;
  }
  if (personas.find(p => p.codigo === codigo)) {
    toast('⚠️ Ese código ya existe', 'warn'); return;
  }

  personas.push({ fecha, nombre, codigo, deuda, abonos: [] });
  await guardar();
  actualizarResumen();

  document.getElementById('reg-nombre').value = '';
  document.getElementById('reg-codigo').value = '';
  document.getElementById('reg-deuda').value  = '';
  toast(`✅ ${nombre} registrado`);

  const b = document.getElementById('busqueda').value;
  if (b) buscar(b);
}

/* ════════════════════════════════
   REGISTRAR ABONO
════════════════════════════════ */
async function abonar() {
  const fecha  = document.getElementById('abo-fecha').value || hoy();
  const codigo = document.getElementById('abo-codigo').value.trim().toUpperCase();
  const valor  = Number(document.getElementById('abo-valor').value);

  if (!codigo || !valor) {
    toast('⚠️ Ingresa código y valor', 'warn'); return;
  }
  const p = personas.find(x => x.codigo === codigo);
  if (!p) {
    toast('❌ Código no encontrado', 'err'); return;
  }

  p.abonos.push({ fecha, valor });
  await guardar();
  actualizarResumen();
  document.getElementById('abo-valor').value = '';

  const s = saldo(p);
  toast(s <= 0 ? `🎉 ¡${p.nombre} pagó todo!` : `✅ Abono a ${p.nombre}`);

  const b = document.getElementById('busqueda').value;
  if (b) buscar(b);
}

/* ════════════════════════════════
   ELIMINAR
════════════════════════════════ */
async function eliminar(codigo) {
  const p = personas.find(x => x.codigo === codigo);
  if (!confirm(`¿Eliminar a ${p.nombre}?`)) return;
  personas = personas.filter(x => x.codigo !== codigo);
  await guardar();
  actualizarResumen();
  toast('🗑️ Eliminado', 'err');
  const b = document.getElementById('busqueda').value;
  buscar(b);
}

/* ════════════════════════════════
   HISTORIAL
════════════════════════════════ */
function verHistorial(codigo) {
  const p   = personas.find(x => x.codigo === codigo);
  const abo = totalAbo(p.abonos);
  const sal = saldo(p);
  const d   = dias(p.fecha);

  document.getElementById('m-titulo').textContent   = `📋 ${p.nombre}`;
  document.getElementById('m-sub').textContent      = `Código: ${p.codigo} · Desde: ${p.fecha}`;
  document.getElementById('m-prestado').textContent = fmt(p.deuda);
  document.getElementById('m-abonado').textContent  = fmt(abo);
  document.getElementById('m-saldo').textContent    = fmt(sal);
  document.getElementById('m-dias').textContent     = `${d} días`;

  let html = '';
  if (!p.abonos.length) {
    html = '<div style="text-align:center;padding:20px;color:var(--txt2);font-size:13px;">Sin abonos registrados</div>';
  } else {
    [...p.abonos].reverse().forEach((a, i) => {
      html += `<div class="abono-row">
        <div>
          <div class="abono-num">Abono #${p.abonos.length - i}</div>
          <div class="abono-fecha">${a.fecha}</div>
        </div>
        <div class="abono-val">${fmt(a.valor)}</div>
      </div>`;
    });
  }
  document.getElementById('m-abonos').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}

function cerrarModal(e) {
  if (!e || e.target === document.getElementById('modal'))
    document.getElementById('modal').classList.remove('open');
}

/* ════════════════════════════════
   BUSCAR
════════════════════════════════ */
function buscar(filtro) {
  const cont = document.getElementById('resultado-busqueda');
  const q = filtro.trim().toLowerCase();

  if (!q) { cont.innerHTML = ''; return; }

  const lista = personas.filter(p =>
    saldo(p) > 0 &&
    (p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q))
  );

  if (!lista.length) {
    cont.innerHTML = `<div class="estado-vacio" style="padding-top:16px;">
      <p>Sin resultados para "<strong>${filtro}</strong>"</p>
      <small>Verifica el código o nombre</small>
    </div>`;
    return;
  }

  cont.innerHTML = '<div style="margin-top:12px;">' + lista.map((p, i) => {
    const abo = totalAbo(p.abonos);
    const sal = saldo(p);
    const pct = Math.min(100, Math.round((abo / p.deuda) * 100));
    const d   = dias(p.fecha);
    const urg = urgencia(d);

    return `<div class="deudor-card ${urg.cls}" style="animation-delay:${i*0.06}s">
      <div class="d-top">
        <div>
          <div class="d-nombre">${p.nombre}</div>
          <div class="d-meta">Código: ${p.codigo} · 📅 ${p.fecha}</div>
        </div>
        <span class="badge-dias ${urg.bdg}">${urg.txt}</span>
      </div>
      <div class="d-montos">
        <div class="d-monto"><span class="d-monto-val col-negro">${fmt(p.deuda)}</span><span class="d-monto-lbl">Prestado</span></div>
        <div class="d-monto"><span class="d-monto-val col-rojo">${fmt(abo)}</span><span class="d-monto-lbl">Abonado</span></div>
        <div class="d-monto"><span class="d-monto-val col-verde">${fmt(sal)}</span><span class="d-monto-lbl">Saldo</span></div>
      </div>
      <div class="d-barra">
        <div class="d-barra-track"><div class="d-barra-fill" style="width:${pct}%"></div></div>
        <div class="d-barra-pct">${pct}% pagado</div>
      </div>
      <div class="d-acciones">
        <button class="btn-sm btn-sm-azul" onclick="verHistorial('${p.codigo}')">📋 Ver historial</button>
        <button class="btn-sm btn-sm-rojo" onclick="eliminar('${p.codigo}')">🗑️ Eliminar</button>
      </div>
    </div>`;
  }).join('') + '</div>';
}

/* ── INICIO ── */
init();
</script>
