<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuentas Pendientes</title>

<style>

body{
font-family: Arial;
margin:0;
padding:15px;
background:#f2f2f2;
}

h1{
text-align:center;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

input,button{
width:100%;
padding:10px;
margin-top:8px;
font-size:16px;
}

button{
background:#2e7d32;
color:white;
border:none;
border-radius:5px;
}

button:hover{
background:#1b5e20;
}

table{
width:100%;
margin-top:15px;
border-collapse:collapse;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
font-size:14px;
}

.eliminar{
background:red;
}

</style>
</head>

<body>

<div class="container">

<h1>Cuentas Pendientes</h1>

<input type="date" id="fecha">
<input type="text" id="nombre" placeholder="Nombre">
<input type="text" id="codigo" placeholder="Código (2 dígitos)">
<input type="number" id="deuda" placeholder="Deuda">

<button onclick="registrar()">Registrar Persona</button>

<hr>

<input type="text" id="codigoAbono" placeholder="Código persona">
<input type="number" id="abono" placeholder="Abono">

<button onclick="abonar()">Registrar Abono</button>

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Nombre</th>
<th>Deuda</th>
<th>Abono</th>
<th>Saldo</th>
<th>Días</th>
<th>Eliminar</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

<script>

let personas = JSON.parse(localStorage.getItem("personas")) || [];

function guardar(){
localStorage.setItem("personas", JSON.stringify(personas));
}

function formato(n){
return n.toLocaleString("es-CO");
}

function dias(fecha){

let inicio = new Date(fecha);
let hoy = new Date();

let diferencia = hoy - inicio;

return Math.floor(diferencia/(1000*60*60*24));

}

function registrar(){

let fecha = document.getElementById("fecha").value;
let nombre = document.getElementById("nombre").value;
let codigo = document.getElementById("codigo").value;
let deuda = Number(document.getElementById("deuda").value);

if(!fecha || !nombre || !codigo || !deuda){

alert("Complete los datos");
return;

}

personas.push({

fecha,
nombre,
codigo,
deuda,
abono:0

});

guardar();
mostrar();

}

function abonar(){

let codigo = document.getElementById("codigoAbono").value;
let abono = Number(document.getElementById("abono").value);

let persona = personas.find(p => p.codigo == codigo);

if(!persona){

alert("Código no encontrado");
return;

}

persona.abono += abono;

guardar();
mostrar();

}

function eliminar(index){

if(confirm("Eliminar esta persona?")){

personas.splice(index,1);

guardar();
mostrar();

}

}

function mostrar(){

let tabla = document.getElementById("tabla");

tabla.innerHTML="";

personas.forEach((p,i)=>{

let saldo = p.deuda - p.abono;

tabla.innerHTML += `

<tr>

<td>${p.fecha}</td>

<td>${p.nombre} (${p.codigo})</td>

<td>$${formato(p.deuda)}</td>

<td>$${formato(p.abono)}</td>

<td>$${formato(saldo)}</td>

<td>${dias(p.fecha)}</td>

<td><button class="eliminar" onclick="eliminar(${i})">X</button></td>

</tr>

`;

});

}

mostrar();

</script>

</body>
</html>
