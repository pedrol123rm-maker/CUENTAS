<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cuentas Pendientes</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.app{
width:100%;
max-width:100%;
padding:15px;
}

h1{
text-align:center;
margin-bottom:15px;
}

input,button{
width:100%;
padding:14px;
margin-top:8px;
font-size:18px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#2e7d32;
color:white;
border:none;
}

button:active{
background:#1b5e20;
}

.tabla-container{
overflow-x:auto;
margin-top:15px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
font-size:14px;
text-align:center;
}

th{
background:#eeeeee;
}

.eliminar{
background:red;
padding:6px;
font-size:14px;
}

</style>

</head>

<body>

<div class="app">

<h1>Cuentas Pendientes</h1>

<input type="date" id="fecha">
<input type="text" id="nombre" placeholder="Nombre">
<input type="text" id="codigo" placeholder="Código">
<input type="number" id="deuda" placeholder="Deuda">

<button onclick="registrar()">Registrar Persona</button>

<hr>

<input type="text" id="codigoAbono" placeholder="Código para abono">
<input type="number" id="abono" placeholder="Valor del abono">

<button onclick="abonar()">Registrar Abono</button>

<div class="tabla-container">

<table>

<thead>

<tr>
<th>Fecha</th>
<th>Persona</th>
<th>Deuda</th>
<th>Abono</th>
<th>Saldo</th>
<th>Días</th>
<th></th>
</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

<script>

let personas = JSON.parse(localStorage.getItem("personas")) || [];

function guardar(){
localStorage.setItem("personas",JSON.stringify(personas));
}

function formato(n){
return n.toLocaleString("es-CO");
}

function dias(fecha){

let inicio = new Date(fecha);
let hoy = new Date();

let diff = hoy - inicio;

return Math.floor(diff/(1000*60*60*24));

}

function registrar(){

let fecha = document.getElementById("fecha").value;
let nombre = document.getElementById("nombre").value;
let codigo = document.getElementById("codigo").value;
let deuda = Number(document.getElementById("deuda").value);

if(!fecha || !nombre || !codigo || !deuda){
alert("Completa los datos");
return;
}

personas.push({
fecha,
nombre,
codigo,
deuda,
abono:0
});

guardar();
mostrar();

}

function abonar(){

let codigo = document.getElementById("codigoAbono").value;
let valor = Number(document.getElementById("abono").value);

let persona = personas.find(p=>p.codigo==codigo);

if(!persona){
alert("Código no encontrado");
return;
}

persona.abono += valor;

guardar();
mostrar();

}

function eliminar(i){

if(confirm("Eliminar persona?")){

personas.splice(i,1);

guardar();
mostrar();

}

}

function mostrar(){

let tabla = document.getElementById("tabla");

tabla.innerHTML="";

personas.forEach((p,i)=>{

let saldo = p.deuda - p.abono;

tabla.innerHTML += `
<tr>

<td>${p.fecha}</td>
<td>${p.nombre} (${p.codigo})</td>
<td>$${formato(p.deuda)}</td>
<td>$${formato(p.abono)}</td>
<td>$${formato(saldo)}</td>
<td>${dias(p.fecha)}</td>
<td><button class="eliminar" onclick="eliminar(${i})">X</button></td>

</tr>
`;

});

}

mostrar();

</script>

</body>
</html>
